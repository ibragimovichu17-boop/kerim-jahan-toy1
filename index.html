<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çakylyk</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #fcf8f8;
      padding: 40px 20px;
    }

    .music-btn {
      background-color: #d88a8a;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.3s ease;
    }

    .music-btn:hover {
      background-color: #c57575;
    }
  </style>
</head>
<body>

  <!-- Aýdym pleýeri -->
  <audio id="myAudio" loop preload="metadata">
    <source src="copy_1D78BEEC-3576-4A52-BC73-736F7E45F238.mp3" type="audio/mpeg">
    Brauzeriňiz audio elementi goldamaýar.
  </audio>

  <!-- Sazy başlatmak/saklamak üçin düwme -->
  <button id="musicBtn" class="music-btn" onclick="toggleMusic()">🎵 Sazy başlat</button>

  <script>
    const audio = document.getElementById("myAudio");
    const musicBtn = document.getElementById("musicBtn");
    let isPlayedOnce = false;

    function toggleMusic() {
      if (audio.paused) {
        // Diňe birinji gezek basylanda 11-nji sekundyndan başlaýar
        if (!isPlayedOnce) {
          audio.currentTime = 11;
          isPlayedOnce = true;
        }
        audio.play();
        musicBtn.innerHTML = "⏸️ Sazy sakla";
      } else {
        audio.pause();
        musicBtn.innerHTML = "🎵 Sazy başlat";
      }
    }

    // Ulanyjy ekrana bir gezek basanda hem 11-nji sekundyndan awtomatiki başlatmak üçin:
    document.addEventListener('click', function() {
      if (!isPlayedOnce && audio.paused) {
        audio.currentTime = 11;
        audio.play().then(() => {
          isPlayedOnce = true;
          musicBtn.innerHTML = "⏸️ Sazy sakla";
        }).catch(err => {
          console.log("Awtomatiki oýnamak çäklendirildi:", err);
        });
      }
    }, { once: true });
  </script>

</body>
</html>
