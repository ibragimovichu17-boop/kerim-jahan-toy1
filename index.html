  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ 
      once: false, 
      duration: 1000,
      easing: 'ease-out-cubic'
    });

    const overlay = document.getElementById('envelope-overlay');
    const audio = document.getElementById("wedding-audio");
    const musicIcon = document.getElementById("music-icon");
    const musicBtn = document.getElementById("music-btn");

    let isOpened = false;

    // Aýdymy açmak funksiýasy
    function startAudio() {
      if (audio.paused) {
        // 11-nji sekuntdan başlatmak
        audio.currentTime = 11;
        var promise = audio.play();

        if (promise !== undefined) {
          promise.then(_ => {
            if (musicIcon) {
              musicIcon.classList.remove("fa-music");
              musicIcon.classList.add("fa-pause");
            }
          }).catch(error => {
            console.log("Autoplay çäklendirildi, düwmä basyň:", error);
          });
        }
      }
    }

    // Konwerte (Envelope) basylanda
    overlay.addEventListener('click', () => {
      if (isOpened) return;
      isOpened = true;

      startAudio();
      overlay.classList.add('opened');

      setTimeout(() => {
        AOS.refresh();
      }, 600);
    });

    // Saz düwmesine basylanda (Play/Pause)
    musicBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (audio.paused) {
        if (!isOpened) {
          audio.currentTime = 11;
          isOpened = true;
        }
        audio.play();
        musicIcon.classList.remove("fa-music");
        musicIcon.classList.add("fa-pause");
      } else {
        audio.pause();
        musicIcon.classList.remove("fa-pause");
        musicIcon.classList.add("fa-music");
      }
    });

    // TOÝA ÇENLI WAGT SANAÝJY
    const weddingDate = new Date("October 17, 2026 18:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = weddingDate - now;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = days < 10 ? "0" + days : days;
        document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
        document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
        document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
      } else {
        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
